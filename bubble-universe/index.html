<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Universe</title>
    <link rel="icon" href="favicon.ico">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 2rem;
            border-radius: 8px;
        }
        .success { background: #1a3; }
        .error { background: #c33; }

        .control-panel {
            position: fixed;
            top: 10px;
            left: 20px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            z-index: 100;
        }

        .control-panel.open {
            background-color: rgba(40, 40, 40, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0 8px 8px 8px;
            box-shadow: 4px 4px 16px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none;
            border-top: none;
        }

        details, summary {
            margin: 0;
            padding: 0;
        }

        .disclosure-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            background: transparent;
            outline: none;
            border: 1px transparent;
            padding: 2px;
            flex-shrink: 0;
        }

        .disclosure-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1px;
        }

        .disclosure-toggle svg {
            width: 16px;
            height: 16px;
            fill: #fff;
            transition: transform 0.2s ease;
        }

        .control-panel.open .disclosure-toggle svg {
            transform: rotate(90deg);
            fill: #898989;
        }

        .panel-content {
            padding: 4px 8px 4px 2px;
            display: none;
            flex-direction: column;
            gap: 4px;
            color: #fff;
        }

        .control-panel.open .panel-content {
            display: flex;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .control-group:open:not(:last-child) {
            padding-bottom: 4px;
        }

        .control-group:open:last-child {
            padding-bottom: 8px;
        }

        .control-group:open > :not(summary) {
            padding-left: 8px;
        }

        .control-group:not(:last-child) {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group > summary {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            font-weight: 600;
            margin: 0 0 2px 0;
        }

        .control-group > summary:not(:open) {
            margin-bottom: 8px;
        }

        .dirty-dot {
            color: #f0a030;
            font-size: 9px;
        }

        .control-group > label:not(:first-child) {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #777;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reset-btn {
            background: none;
            border: none;
            padding: 3px;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .reset-btn:disabled {
            opacity: 0.3;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .reset-btn:disabled {
            background: transparent;
        }

        .reset-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        input[type="range"] {
            width: 120px;
            cursor: pointer;
            accent-color: #ff4444;
        }

        .select-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        select {
            width: 100%;
            font-size: 11px;
            padding: 2px 6px;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .value-tbox {
            font-size: 10px;
            width: 48px;
            padding: 2px 3px;
            text-align: right;
            font-family: monospace;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
        }

        .value-tbox:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="675" height="540"></canvas>
    <div id="status">Initializing WebGPU...</div>

    <div id="controlPanel" class="control-panel">
        <button id="disclosureToggle" class="disclosure-toggle" aria-label="Toggle control panel">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
        </button>
        <div class="panel-content">
            <details open class="control-group">
                <summary>Motion <span class="dirty-dot" id="motionDot"> </span></summary>
                <label for="seqCountSlider">Sequence Count</label>
                <div class="slider-container">
                    <button id="seqCountResetBtn" class="reset-btn" aria-label="Reset sequence count to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="seqCountSlider" min="0" step="1">
                    <input type="text" id="seqCountTbox" class="value-tbox">
                </div>
                <label for="seqLengthSlider">Sequence Length</label>
                <div class="slider-container">
                    <button id="seqLengthResetBtn" class="reset-btn" aria-label="Reset sequence length to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="seqLengthSlider" min="0" step="1">
                    <input type="text" id="seqLengthTbox" class="value-tbox">
                </div>
                <label for="speedSlider">Speed</label>
                <div class="slider-container">
                    <button id="speedResetBtn" class="reset-btn" aria-label="Reset speed to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="speedSlider" min="0" max="10" step="0.001">
                    <input type="text" id="speedTbox" class="value-tbox">
                </div>
                <label for="rSlider">R</label>
                <div class="slider-container">
                    <button id="rResetBtn" class="reset-btn" aria-label="Reset R to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="rSlider" min="0" max="3.141592653589793" step="0.001">
                    <input type="text" id="rTbox" class="value-tbox">
                </div>
                <label for="sSlider">S</label>
                <div class="slider-container">
                    <button id="sResetBtn" class="reset-btn" aria-label="Reset S to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="sSlider" min="0" max="1" step="0.001">
                    <input type="text" id="sTbox" class="value-tbox">
                </div>
                <label for="sBlocksSlider">S Blocks</label>
                <div class="slider-container">
                    <button id="sBlocksResetBtn" class="reset-btn" aria-label="Reset S blocks to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="sBlocksSlider" min="1" step="1">
                    <input type="text" id="sBlocksTbox" class="value-tbox">
                </div>
            </details>
            <details open class="control-group">
                <summary>Appearance <span class="dirty-dot" id="appearanceDot"> </span></summary>
                <label for="themeSelect">Theme</label>
                <div class="select-container">
                    <button id="themeResetBtn" class="reset-btn" aria-label="Reset theme to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <select id="themeSelect">
                        <option value="0">Classic</option>
                        <option value="1">Vapor</option>
                        <option value="2">Midnight</option>
                        <option value="3">Fiesta</option>
                        <option value="4">Easter</option>
                        <option value="5">Bone</option>
                        <option value="6">Oscilloscope</option>
                        <option value="7">Triad</option>
                    </select>
                </div>
                <label for="bgThemeSelect">Background</label>
                <div class="select-container">
                    <button id="bgThemeResetBtn" class="reset-btn" aria-label="Reset background to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <select id="bgThemeSelect">
                        <option value="-1" selected>Same</option>
                        <option value="0">Classic</option>
                        <option value="1">Vapor</option>
                        <option value="2">Midnight</option>
                        <option value="3">Fiesta</option>
                        <option value="4">Easter</option>
                        <option value="6">Oscilloscope</option>
                    </select>
                </div>
                <label for="particleSizeSlider">Particle Size</label>
                <div class="slider-container">
                    <button id="particleSizeResetBtn" class="reset-btn" aria-label="Reset particle size to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="particleSizeSlider" min="0.7" max="200" step="0.1">
                    <input type="text" id="particleSizeTbox" class="value-tbox">
                </div>
                <label for="trailPersistenceSlider">Trail Persistence</label>
                <div class="slider-container">
                    <button id="trailPersistenceResetBtn" class="reset-btn" aria-label="Reset trail persistence to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="trailPersistenceSlider" min="0" max="1" step="0.01">
                    <input type="text" id="trailPersistenceTbox" class="value-tbox">
                </div>
                <label for="trailDiffusionSlider">Trail Diffusion</label>
                <div class="slider-container">
                    <button id="trailDiffusionResetBtn" class="reset-btn" aria-label="Reset trail diffusion to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="trailDiffusionSlider" min="0" max="1" step="0.01">
                    <input type="text" id="trailDiffusionTbox" class="value-tbox">
                </div>
            </details>
            <details class="control-group">
                <summary>Brightness <span class="dirty-dot" id="brightnessDot"> </span></summary>
                <label for="backgroundSlider">Background</label>
                <div class="slider-container">
                    <button id="backgroundResetBtn" class="reset-btn" aria-label="Reset background to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="backgroundSlider" min="0" max="2" step="0.01">
                    <input type="text" id="backgroundTbox" class="value-tbox">
                </div>
                <label for="trailsSlider">Trails</label>
                <div class="slider-container">
                    <button id="trailsResetBtn" class="reset-btn" aria-label="Reset trails to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="trailsSlider" min="0" max="2" step="0.01">
                    <input type="text" id="trailsTbox" class="value-tbox">
                </div>
                <label for="particlesSlider">Particles</label>
                <div class="slider-container">
                    <button id="particlesResetBtn" class="reset-btn" aria-label="Reset particles to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="particlesSlider" min="0" max="2" step="0.01">
                    <input type="text" id="particlesTbox" class="value-tbox">
                </div>
            </details>
            <details class="control-group">
                <summary>Post <span class="dirty-dot" id="postDot"></span></summary>
                <label for="bloomAmountSlider">Bloom Amount</label>
                <div class="slider-container">
                    <button id="bloomAmountResetBtn" class="reset-btn" aria-label="Reset bloom amount to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="bloomAmountSlider" min="0" max="5" step="0.01">
                    <input type="text" id="bloomAmountTbox" class="value-tbox">
                </div>
                <label for="bloomSizeSlider">Bloom Size</label>
                <div class="slider-container">
                    <button id="bloomSizeResetBtn" class="reset-btn" aria-label="Reset bloom size to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="bloomSizeSlider" min="0" max="2" step="0.01">
                    <input type="text" id="bloomSizeTbox" class="value-tbox">
                </div>
                <label for="toneMapBoostSlider">Tone Map Boost</label>
                <div class="slider-container">
                    <button id="toneMapBoostResetBtn" class="reset-btn" aria-label="Reset tone map boost to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="toneMapBoostSlider" min="0" max="10" step="0.01">
                    <input type="text" id="toneMapBoostTbox" class="value-tbox">
                </div>
                <label for="toneMapWhiteSlider">Tone Map Ceiling</label>
                <div class="slider-container">
                    <button id="toneMapWhiteResetBtn" class="reset-btn" aria-label="Reset tone map ceiling to default" disabled>
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                        </svg>
                    </button>
                    <input type="range" id="toneMapWhiteSlider" min="2" max="10" step="0.01">
                    <input type="text" id="toneMapWhiteTbox" class="value-tbox">
                </div>
            </details>
        </div>
    </div>

    <script type="module">
        import { Bubbler } from './src/bubbler.js';
        import { Defaults, MAX_SEQ_COUNT, MAX_SEQ_LENGTH, MAX_S_BLOCKS, Theme } from './src/constants.js';

        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');

        const controlPanel = document.getElementById('controlPanel');
        const disclosureToggle = document.getElementById('disclosureToggle');
        const seqCountSlider = document.getElementById('seqCountSlider');
        const seqCountTbox = document.getElementById('seqCountTbox');
        const seqCountResetBtn = document.getElementById('seqCountResetBtn');
        const seqLengthSlider = document.getElementById('seqLengthSlider');
        const seqLengthTbox = document.getElementById('seqLengthTbox');
        const seqLengthResetBtn = document.getElementById('seqLengthResetBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedTbox = document.getElementById('speedTbox');
        const speedResetBtn = document.getElementById('speedResetBtn');
        const rSlider = document.getElementById('rSlider');
        const rTbox = document.getElementById('rTbox');
        const rResetBtn = document.getElementById('rResetBtn');
        const sSlider = document.getElementById('sSlider');
        const sTbox = document.getElementById('sTbox');
        const sResetBtn = document.getElementById('sResetBtn');
        const sBlocksSlider = document.getElementById('sBlocksSlider');
        const sBlocksTbox = document.getElementById('sBlocksTbox');
        const sBlocksResetBtn = document.getElementById('sBlocksResetBtn');
        const particleSizeSlider = document.getElementById('particleSizeSlider');
        const particleSizeTbox = document.getElementById('particleSizeTbox');
        const particleSizeResetBtn = document.getElementById('particleSizeResetBtn');
        const trailPersistenceSlider = document.getElementById('trailPersistenceSlider');
        const trailPersistenceTbox = document.getElementById('trailPersistenceTbox');
        const trailPersistenceResetBtn = document.getElementById('trailPersistenceResetBtn');
        const trailDiffusionSlider = document.getElementById('trailDiffusionSlider');
        const trailDiffusionTbox = document.getElementById('trailDiffusionTbox');
        const trailDiffusionResetBtn = document.getElementById('trailDiffusionResetBtn');
        const backgroundSlider = document.getElementById('backgroundSlider');
        const backgroundTbox = document.getElementById('backgroundTbox');
        const backgroundResetBtn = document.getElementById('backgroundResetBtn');
        const trailsSlider = document.getElementById('trailsSlider');
        const trailsTbox = document.getElementById('trailsTbox');
        const trailsResetBtn = document.getElementById('trailsResetBtn');
        const particlesSlider = document.getElementById('particlesSlider');
        const particlesTbox = document.getElementById('particlesTbox');
        const particlesResetBtn = document.getElementById('particlesResetBtn');
        const bloomAmountSlider = document.getElementById('bloomAmountSlider');
        const bloomAmountTbox = document.getElementById('bloomAmountTbox');
        const bloomAmountResetBtn = document.getElementById('bloomAmountResetBtn');
        const bloomSizeSlider = document.getElementById('bloomSizeSlider');
        const bloomSizeTbox = document.getElementById('bloomSizeTbox');
        const bloomSizeResetBtn = document.getElementById('bloomSizeResetBtn');
        const toneMapBoostSlider = document.getElementById('toneMapBoostSlider');
        const toneMapBoostTbox = document.getElementById('toneMapBoostTbox');
        const toneMapBoostResetBtn = document.getElementById('toneMapBoostResetBtn');
        const toneMapWhiteSlider = document.getElementById('toneMapWhiteSlider');
        const toneMapWhiteTbox = document.getElementById('toneMapWhiteTbox');
        const toneMapWhiteResetBtn = document.getElementById('toneMapWhiteResetBtn');
        const themeSelect = document.getElementById('themeSelect');
        const themeResetBtn = document.getElementById('themeResetBtn');
        const bgThemeSelect = document.getElementById('bgThemeSelect');
        const bgThemeResetBtn = document.getElementById('bgThemeResetBtn');
        const motionDot = document.getElementById('motionDot');
        const appearanceDot = document.getElementById('appearanceDot');
        const brightnessDot = document.getElementById('brightnessDot');
        const postDot = document.getElementById('postDot');

        const defaultSeqCount = Defaults.SEQ_COUNT;
        const defaultSeqLength = Defaults.SEQ_LENGTH;
        const defaultSpeed = Defaults.SPEED;
        const defaultR = Defaults.R;
        const defaultS = Defaults.S;
        const defaultSBlocks = Defaults.S_BLOCKS;
        const defaultParticleSize = Defaults.PARTICLE_SIZE;
        const defaultTrailPersistence = Defaults.TRAIL_PERSISTENCE;
        const defaultTrailDiffusion = Defaults.TRAIL_DIFFUSION;
        const defaultBackground = Defaults.BACKGROUND_BRIGHTNESS;
        const defaultTrails = Defaults.TRAILS_BRIGHTNESS;
        const defaultParticles = Defaults.PARTICLES_BRIGHTNESS;
        const defaultToneMapBoost = Defaults.TONE_MAP_BOOST;
        const defaultToneMapWhite = Defaults.TONE_MAP_WHITE;

        const defaultBloomAmount = 1;
        const defaultBloomSize = 1;

        seqCountSlider.max = MAX_SEQ_COUNT;
        seqLengthSlider.max = MAX_SEQ_LENGTH;
        seqCountSlider.value = defaultSeqCount;
        seqLengthSlider.value = defaultSeqLength;
        speedSlider.value = defaultSpeed;
        rSlider.value = defaultR;
        sSlider.value = defaultS;
        sBlocksSlider.value = defaultSBlocks;
        particleSizeSlider.value = defaultParticleSize;
        trailPersistenceSlider.value = defaultTrailPersistence;
        trailDiffusionSlider.value = defaultTrailDiffusion;
        backgroundSlider.value = defaultBackground;
        trailsSlider.value = defaultTrails;
        particlesSlider.value = defaultParticles;
        bloomAmountSlider.value = defaultBloomAmount;
        bloomSizeSlider.value = defaultBloomSize;
        toneMapBoostSlider.value = defaultToneMapBoost;
        toneMapWhiteSlider.value = defaultToneMapWhite;
        seqCountTbox.value = defaultSeqCount;
        seqLengthTbox.value = defaultSeqLength;
        speedTbox.value = defaultSpeed.toFixed(3);
        rTbox.value = defaultR.toFixed(3);
        sTbox.value = defaultS.toFixed(3);

        function togglePanel() {
            const isOpen = controlPanel.classList.contains('open');

            controlPanel.classList.toggle('open');
            if (isOpen) {
                disclosureToggle.focus();
            }
        }

        disclosureToggle.addEventListener('click', togglePanel);

        document.addEventListener('keydown', (e) => {

            // Don't steal focus if the active input is a summary, button,
            // select, or textbox.
            // Do steal focus if the active input is a range.

            if (e.key !== 'Enter' && e.key != ' ') return;

            const panelOpen = controlPanel.classList.contains('open');
            const activeEl = document.activeElement || document.body;
            const isSummary = activeEl.tagName === 'SUMMARY';
            const isButton = activeEl.tagName === 'BUTTON'
            const isSelect = activeEl.tagName === 'SELECT';
            const isText = activeEl.matches('input[type="text"]')
            const doIt = !panelOpen || !(isSummary || isButton || isSelect || isText);

            if (doIt) {
                e.preventDefault();
                togglePanel();
            }
        });

        async function init() {
            if (!navigator.gpu) {
                status.textContent = 'WebGPU not supported in this browser.';
                status.className = 'error';
                return;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    status.textContent = 'No WebGPU adapter found.';
                    status.className = 'error';
                    return;
                }

                const device = await adapter.requestDevice();
                const format = navigator.gpu.getPreferredCanvasFormat();

                const context = canvas.getContext('webgpu');
                context.configure({ device, format, alphaMode: 'premultiplied' });

                const bubbler = new Bubbler(canvas, context, format);
                await bubbler.init(device);
                window._bubbler = bubbler;

                // status.textContent = 'Running...';
                // status.className = 'success';
                // setTimeout(() => { status.style.display = 'none'; }, 1000);

                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    context.configure({ device, format, alphaMode: 'premultiplied' });
                    bubbler.resize([canvas.width, canvas.height]);
                }
                window.addEventListener('resize', resize);
                resize();

                function frame() {
                    try {
                        const particleSize = parseFloat(particleSizeSlider.value);
                        const defaultBloomAmount = Defaults.BLOOM_AMOUNT * Defaults.PARTICLE_SIZE / particleSize;
                        const actualBloomAmount = defaultBloomAmount * parseFloat(bloomAmountSlider.value);
                        const actualBloomSize = Defaults.BLOOM_SIZE * parseFloat(bloomSizeSlider.value);
                        bubbler.draw_frame({
                            bloom_amount: actualBloomAmount,
                            bloom_size: actualBloomSize,
                        });
                    } catch (e) {
                        console.error('Draw error:', e);
                    }
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);

            } catch (e) {
                status.textContent = 'Error: ' + e.message;
                status.className = 'error';
                console.error(e);
            }
        }

        init();
